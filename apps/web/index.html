<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ampara</title>
    <script>
      // Modo noturno antes da tela aparecer, para não piscar claro (mesma regra de src/shared/lib/tema.ts).
      try {
        var tema = localStorage.getItem('ampara:tema');
        if (
          tema === 'escuro' ||
          (tema !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)
        )
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
